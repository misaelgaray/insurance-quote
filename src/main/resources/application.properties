spring.application.name=insurance-quote

# Datasource Settings (Uses Docker env vars with local defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/insurance_quote_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:katyacabreraislas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Changed from 'update' to 'validate' so Flyway manages schema creation and migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka Configuration
# Uses environment variables so Docker can use 'kafka:9092' while local uses 'localhost:9094'
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.admin.properties.bootstrap.servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Producer configuration
spring.kafka.producer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
app.jwt.expiration-ms=3600000

# Draft Expiration Job Configuration
app.quoting.draft-expiration.window-minutes=30
app.quoting.draft-expiration.cron=0 */5 * * * *

# External Fulfillment API Configuration (httpstat.us)
app.fulfillment.api-url=https://httpbin.org/status
app.fulfillment.target-endpoint=/200
app.fulfillment.connect-timeout-ms=3000
app.fulfillment.read-timeout-ms=3000